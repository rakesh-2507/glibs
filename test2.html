<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glibs</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }
    #three-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    #exit-3d {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: white;
      border: 1px solid #333;
      border-radius: 20px;
      cursor: pointer;
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="three-container"></div>
  <button id="exit-3d">Exit 3D</button>

  <!-- Three.js + extras -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, controls, model, envMap;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 6);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;

      // Tone mapping for balanced highlights
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      document.getElementById("three-container").appendChild(renderer.domElement);

      // Fixed OrbitControls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // Ambient light (soft fill)
      const ambient = new THREE.AmbientLight(0xffffff, 0.2);
      scene.add(ambient);

      // Directional light (soft overhead)
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(0, 20, 0);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Sparkle lights for bumps
      const sparkle1 = new THREE.PointLight(0xffffff, 6, 20);
      sparkle1.position.set(2, 3, 2);
      scene.add(sparkle1);

      const sparkle2 = new THREE.PointLight(0xffffff, 5, 15);
      sparkle2.position.set(-3, 2, -2);
      scene.add(sparkle2);

      // HDR environment
      const rgbeLoader = new THREE.RGBELoader();
      const pmremGen = new THREE.PMREMGenerator(renderer);
      pmremGen.compileEquirectangularShader();

      rgbeLoader.load("textures/diamond.hdr", (hdr) => {
        envMap = pmremGen.fromEquirectangular(hdr).texture;
        scene.environment = envMap;
        scene.background = null;
        hdr.dispose();
        pmremGen.dispose();

        if (model) applyDiamondMaterial(model);
      });

      // Ground shadow catcher
      const groundGeo = new THREE.PlaneGeometry(100, 100);
      const groundMat = new THREE.ShadowMaterial({ opacity: 0.3 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -3;
      ground.receiveShadow = true;
      scene.add(ground);

      // Load model
      const loader = new THREE.GLTFLoader();
      loader.load("models/glibs.glb", (gltf) => {
        model = gltf.scene;
        model.position.set(0, -3, 0);
        model.scale.set(1.5, 1.5, 1.5);
        model.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
        scene.add(model);

        if (envMap) applyDiamondMaterial(model);
      });

      window.addEventListener("resize", onWindowResize);
    }

    // Diamond-like material
    function applyDiamondMaterial(obj) {
      const texLoader = new THREE.TextureLoader();
      const normalMap = texLoader.load("textures/diamond_normal_map.jpg");

      obj.traverse((child) => {
        if (child.isMesh) {
          child.material = new THREE.MeshPhysicalMaterial({
            envMap: envMap,
            envMapIntensity: 0.8,      // softer reflections
            roughness: 0.06,           // slight blur for bumps
            metalness: 0.0,
            clearcoat: 1.0,
            clearcoatRoughness: 0.05,
            normalMap: normalMap,
            normalScale: new THREE.Vector2(1.0, 1.0),
            transmission: 1.0,
            ior: 2.4,
            thickness: 0.6,
            iridescence: 1.0,
            iridescenceIOR: 2.4,
            iridescenceThicknessRange: [100, 400],
          });
          child.material.needsUpdate = true;
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
